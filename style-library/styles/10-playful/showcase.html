<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 · 게이미피케이션</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="shell">
    <!-- 상태바 -->
    <div class="hud">
      <span class="brand">🦉 Lingo</span>
      <div class="stats">
        <span class="s fire">🔥 12</span>
        <span class="s gem">💎 480</span>
        <span class="s heart">❤️ 5</span>
        <a href="../../index.html" class="btn ghost" style="padding:6px 14px;font-size:.75rem">← 카탈로그</a>
      </div>
    </div>

    <!-- 히어로 -->
    <div class="hero">
      <div>
        <h1>재미있게 배우는<br>하루 5분 학습</h1>
        <p>게임처럼 즐기다 보면 어느새 실력이 쑥. 연속 학습 기록을 이어가 보세요!</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <a href="#" class="btn">지금 시작하기</a>
          <a href="#" class="btn ghost">계정 있어요</a>
        </div>
      </div>
      <div class="mascot">🦉</div>
    </div>

    <!-- 진행 경로 -->
    <div class="section-h"><h2>1단원 · 기초 개념</h2></div>
    <div class="path">
      <div class="node done">⭐</div>
      <div class="node done">📘</div>
      <div class="node now"><span class="cap">시작!</span>▶</div>
      <div class="node lock">🔒</div>
      <div class="node lock">🏆</div>
    </div>

    <!-- 퀴즈 카드 -->
    <div class="section-h"><h2>오늘의 문제</h2></div>
    <div class="q">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
        <span style="font-size:1.4rem">❤️</span>
        <div class="xpbar"><span style="width:60%"></span></div>
      </div>
      <h2>광합성에 필요한 기체는?</h2>
      <button class="opt">🌬️ 산소</button>
      <button class="opt">💧 수소</button>
      <button class="opt">🍃 이산화 탄소</button>
      <a href="#" class="btn block" style="margin-top:8px">확인</a>
    </div>

    <!-- 통계 카드 -->
    <div class="section-h"><h2>나의 기록</h2></div>
    <div class="grid">
      <div class="card"><div class="big">🔥</div><h2>12일</h2><p>연속 학습</p></div>
      <div class="card"><div class="big">⚡</div><h2>2,340</h2><p>총 XP</p></div>
      <div class="card"><div class="big">🏅</div><h2>Gold</h2><p>현재 리그</p></div>
    </div>

    <div class="foot">10 · GAMIFIED — style-library</div>
  </div>
</body>
</html>
