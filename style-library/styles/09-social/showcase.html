<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09 · 소셜 피드</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <a href="../../index.html" class="backlink">← 카탈로그</a>

  <div class="phone">
    <div class="appbar">
      <span class="logo">Snapgram</span>
      <div class="sp"><span>♡</span><span>✈</span></div>
    </div>

    <div class="feed">
      <!-- 스토리 -->
      <div class="stories">
        <div class="story"><div class="ring"><div>＋</div></div><span>내 스토리</span></div>
        <div class="story"><div class="ring"><div>🐱</div></div><span>지민</span></div>
        <div class="story"><div class="ring"><div>🌊</div></div><span>바다</span></div>
        <div class="story"><div class="ring"><div>🍰</div></div><span>디저트</span></div>
        <div class="story"><div class="ring"><div>⚽</div></div><span>축구</span></div>
        <div class="story"><div class="ring"><div>🎸</div></div><span>밴드</span></div>
      </div>

      <!-- 포스트 1 -->
      <div class="post">
        <div class="phead"><div class="av"><div>🏔</div></div><span class="u">wander.log</span><span class="more">⋯</span></div>
        <div class="pimg" style="background:linear-gradient(135deg,#4facfe,#43e97b)">⛰️</div>
        <div class="pacts"><span>♡</span><span>💬</span><span>✈</span><span class="save">🔖</span></div>
        <div class="likes">좋아요 1,204개</div>
        <div class="cap"><b>wander.log</b> 오늘의 능선. 바람이 좋았다 🌿</div>
        <div class="cmts">댓글 48개 모두 보기</div>
        <div class="time">2시간 전</div>
      </div>

      <!-- 포스트 2 -->
      <div class="post">
        <div class="phead"><div class="av"><div>🍜</div></div><span class="u">seoul.eats</span><span class="more">⋯</span></div>
        <div class="pimg" style="background:linear-gradient(135deg,#fa709a,#fee140)">🍲</div>
        <div class="pacts"><span>♡</span><span>💬</span><span>✈</span><span class="save">🔖</span></div>
        <div class="likes">좋아요 892개</div>
        <div class="cap"><b>seoul.eats</b> 비 오는 날엔 역시 국물 🍜</div>
        <div class="cmts">댓글 23개 모두 보기</div>
        <div class="time">5시간 전</div>
      </div>
    </div>

    <div class="tabbar">
      <span class="t on">🏠</span><span class="t">🔍</span><span class="t">➕</span><span class="t">🎬</span><span class="me"></span>
    </div>
  </div>
</body>
</html>
