<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07 · 스트리밍 다크</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="app">
    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span> Wavelength</div>
      <a href="#" class="on">🏠 홈</a>
      <a href="#">🔍 검색</a>
      <div class="lib">
        <a href="#">📚 내 라이브러리</a>
        <a href="#">💚 좋아요 표시한 곡</a>
        <a href="#">🎵 집중 플레이리스트</a>
        <a href="#">🌙 밤의 재즈</a>
        <a href="#">🏃 운동 부스터</a>
        <a href="../../index.html" style="margin-top:auto;color:#1ed760">← 카탈로그</a>
      </div>
    </aside>

    <!-- 메인 -->
    <main class="main">
      <div class="topbar">
        <span class="chip on">전체</span><span class="chip">음악</span><span class="chip">팟캐스트</span>
        <div class="avatar"></div>
      </div>
      <div class="content">
        <h2>안녕하세요 👋</h2>
        <div class="grid">
          <div class="album"><div class="cover" style="background:linear-gradient(135deg,#f857a6,#ff5858)">🎸</div><h3>여름의 끝</h3><p>The Fades</p><div class="play">▶</div></div>
          <div class="album"><div class="cover" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">🌊</div><h3>깊은 물</h3><p>Marin</p><div class="play">▶</div></div>
          <div class="album"><div class="cover" style="background:linear-gradient(135deg,#43e97b,#38f9d7)">🍃</div><h3>초록 시간</h3><p>Bloom</p><div class="play">▶</div></div>
          <div class="album"><div class="cover" style="background:linear-gradient(135deg,#fa709a,#fee140)">🌅</div><h3>노을</h3><p>Amber Sky</p><div class="play">▶</div></div>
        </div>

        <h2>인기 급상승</h2>
        <div class="rows">
          <div class="trow"><span>1</span><span class="t">별빛 아래 — Nova</span><span>3:24</span></div>
          <div class="trow"><span>2</span><span class="t">도시의 밤 — Ryo</span><span>2:58</span></div>
          <div class="trow"><span>3</span><span class="t">천천히 — Hana</span><span>4:11</span></div>
          <div class="trow"><span>4</span><span class="t">파란 방 — Coda</span><span>3:47</span></div>
        </div>
      </div>
    </main>

    <!-- 재생바 -->
    <div class="player">
      <div class="np"><div class="art"></div><div><div class="t">별빛 아래</div><div class="s">Nova</div></div></div>
      <div class="ctr">
        <div class="btns">🔀 ⏮ <span class="big">⏸</span> ⏭ 🔁</div>
        <div class="bar"><span></span></div>
      </div>
      <div style="min-width:120px;text-align:right;color:var(--muted)">🔊 ▂▄▆</div>
    </div>
  </div>
</body>
</html>
