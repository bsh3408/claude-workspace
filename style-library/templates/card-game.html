<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임 / 카드 UI 템플릿</title>
  <link rel="stylesheet" href="../css/library.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; padding:var(--sp-4);
      background: radial-gradient(ellipse at top, #232a3c, #0f131c); }
    .game { width:100%; max-width:480px; }
    /* 스탯 바 */
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-3); margin-bottom:var(--sp-5); }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:var(--sp-3); }
    .stat .top { display:flex; align-items:center; gap:0.4rem; font-size:var(--fs-sm); color:var(--text-soft); margin-bottom:0.4rem; }
    .meter { height:14px; background:var(--surface-2); border-radius:var(--radius-full); overflow:hidden; }
    .meter > span { display:block; height:100%; border-radius:inherit; transition:width .6s ease; }
    .m-food > span { background:linear-gradient(90deg,#22a06b,#3ecf8e); }
    .m-parts > span { background:linear-gradient(90deg,#e0a100,#ffc233); }
    .m-info > span { background:linear-gradient(90deg,#3b82f6,#60a5fa); }
    .m-rep > span { background:linear-gradient(90deg,#8b5cf6,#a78bfa); }
    /* 카드 */
    .play-card {
      background:linear-gradient(160deg,#2a3040,#1a2030);
      border:1px solid var(--border); border-radius:var(--radius-lg);
      box-shadow:var(--shadow-lg); padding:var(--sp-6); text-align:center;
      transition:transform .5s ease, opacity .5s ease;
    }
    .play-card.swipe-left { transform:translateX(-140%) rotate(-18deg); opacity:0; }
    .play-card.swipe-right { transform:translateX(140%) rotate(18deg); opacity:0; }
    .avatar { width:110px; height:110px; margin:0 auto var(--sp-4); border-radius:50%;
      display:grid; place-items:center; font-size:3.5rem; background:var(--surface-2); }
    .event { color:var(--text-soft); line-height:1.6; min-height:3.5em; margin-block:var(--sp-4); }
    .choices { display:flex; gap:var(--sp-3); }
    .choices .btn { flex:1; min-height:56px; }
  </style>
</head>
<body>
  <div class="game">
    <div class="row-between mb-4">
      <span class="badge">🗓️ Day <span id="day">1</span> / 30</span>
      <button class="btn btn-ghost btn-sm" id="theme-btn">☀️</button>
    </div>

    <!-- 스탯 -->
    <div class="stats">
      <div class="stat"><div class="top">🍞 식량</div><div class="meter m-food"><span id="s-food" style="width:60%"></span></div></div>
      <div class="stat"><div class="top">⚙️ 부품</div><div class="meter m-parts"><span id="s-parts" style="width:45%"></span></div></div>
      <div class="stat"><div class="top">📡 정보</div><div class="meter m-info"><span id="s-info" style="width:70%"></span></div></div>
      <div class="stat"><div class="top">⭐ 평판</div><div class="meter m-rep"><span id="s-rep" style="width:50%"></span></div></div>
    </div>

    <!-- 카드 -->
    <div class="play-card" id="card">
      <div class="avatar" id="avatar">🧙</div>
      <h3 id="name">떠돌이 상인</h3>
      <p class="event" id="event">"식량을 나눠주면 귀한 부품을 드리지요. 거래하시겠소?"</p>
      <div class="choices">
        <button class="btn btn-danger" id="left">거절 ←</button>
        <button class="btn btn-accent" id="right">→ 수락</button>
      </div>
    </div>

    <p class="text-center text-soft mt-4" style="font-size:var(--fs-xs);">좌우 버튼으로 선택 · 스탯이 0이 되면 게임 오버</p>
  </div>

  <script>
    // 데모용 간단 로직
    const CARDS = [
      { emoji:"🧙", name:"떠돌이 상인", event:'"식량을 나눠주면 귀한 부품을 드리지요."', left:{food:0,parts:0}, right:{food:-15,parts:20} },
      { emoji:"🛰️", name:"낡은 통신탑", event:'"수리하면 외부 정보를 얻을 수 있을 것 같다."', left:{info:0}, right:{parts:-15,info:25} },
      { emoji:"👥", name:"굶주린 생존자들", event:'"먹을 것을 나눠주면 우리를 따르겠습니다."', left:{rep:-10}, right:{food:-20,rep:20} },
    ];
    const stats = { food:60, parts:45, info:70, rep:50 };
    let day = 1, ci = 0;
    const el = id => document.getElementById(id);

    function paint() {
      el('s-food').style.width = stats.food + '%';
      el('s-parts').style.width = stats.parts + '%';
      el('s-info').style.width = stats.info + '%';
      el('s-rep').style.width = stats.rep + '%';
      el('day').textContent = day;
      const c = CARDS[ci % CARDS.length];
      el('avatar').textContent = c.emoji;
      el('name').textContent = c.name;
      el('event').textContent = c.event;
    }

    function apply(delta) {
      for (const k in delta) stats[k] = Math.max(0, Math.min(100, stats[k] + delta[k]));
    }

    function choose(dir) {
      const c = CARDS[ci % CARDS.length];
      apply(dir === 'left' ? c.left : c.right);
      const card = el('card');
      card.classList.add(dir === 'left' ? 'swipe-left' : 'swipe-right');
      setTimeout(() => {
        ci++; day++;
        card.classList.remove('swipe-left','swipe-right');
        paint();
      }, 450);
    }

    el('left').onclick = () => choose('left');
    el('right').onclick = () => choose('right');
    el('theme-btn').addEventListener('click', (e) => {
      const html = document.documentElement;
      const dark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', dark ? 'light' : 'dark');
      e.target.textContent = dark ? '🌙' : '☀️';
    });
    paint();
  </script>
</body>
</html>
