<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beer CSS · showcase (Material Design 3)</title>
  <link rel="stylesheet" href="beer.min.css">
  <script type="module" src="beer.min.js"></script>
</head>
<body>
  <header>
    <nav>
      <button class="circle transparent">🍺</button>
      <h6 class="max">Beer CSS</h6>
      <a href="../../index.html" class="button border small-round">← 카탈로그</a>
    </nav>
  </header>

  <main class="responsive">
    <div class="medium-space"></div>
    <h3>머티리얼 디자인 3</h3>
    <p class="large-text">구글의 최신 디자인 시스템을 그대로. 부드러운 곡선, 넘실대는 색, 동적인 컴포넌트.</p>
    <div class="space"></div>

    <nav class="wrap">
      <button>🚀 시작하기</button>
      <button class="border">둘러보기</button>
      <button class="transparent">더 보기</button>
      <a class="chip fill">교육</a>
      <a class="chip">과제</a>
    </nav>

    <div class="space"></div>
    <div class="grid">
      <article class="s12 m6 l4 round">
        <h5>📚 강의실</h5>
        <p>실시간 수업과 자료 공유.</p>
        <nav><button class="small-round">입장</button></nav>
      </article>
      <article class="s12 m6 l4 round primary-container">
        <h5>📝 과제함</h5>
        <p>제출 현황을 한눈에.</p>
        <nav><button class="small-round">확인</button></nav>
      </article>
      <article class="s12 m6 l4 round">
        <h5>📈 성적표</h5>
        <p>자동 집계 리포트.</p>
        <nav><button class="small-round">보기</button></nav>
      </article>
    </div>

    <div class="space"></div>
    <div class="grid">
      <article class="s12 m6 round">
        <h6>참가 신청</h6>
        <div class="field label border round">
          <input type="text">
          <label>이름</label>
        </div>
        <div class="field label suffix border round">
          <select><option>국어</option><option>수학</option><option>과학</option></select>
          <label>분야</label>
        </div>
        <label class="checkbox">
          <input type="checkbox" checked>
          <span>알림 받기</span>
        </label>
        <div class="space"></div>
        <button>제출</button>
      </article>
      <article class="s12 m6 round">
        <h6>현황</h6>
        <div class="row middle-align">
          <progress class="circle"></progress>
          <span>자료 동기화 중…</span>
        </div>
        <div class="space"></div>
        <div class="row wrap">
          <div class="chip round fill">✅ 완료 12</div>
          <div class="chip round">⏳ 진행 5</div>
          <div class="chip round">📌 예정 3</div>
        </div>
        <div class="space"></div>
        <nav class="wrap">
          <button class="small round">전체 보기</button>
          <button class="small border round">내보내기</button>
        </nav>
      </article>
    </div>
  </main>

  <div class="large-space"></div>
  <footer class="center-align"><span class="small-text">Beer CSS · Material Design 3 — style-library / frameworks</span></footer>
</body>
</html>
