<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectre.css · showcase</title>
  <link rel="stylesheet" href="spectre.min.css">
  <style>body{padding:0} .hero-sp{background:linear-gradient(135deg,#5755d9,#7b79e6);color:#fff;padding:3rem 0;margin-bottom:1.5rem}</style>
</head>
<body>
  <header class="navbar" style="padding:.6rem 1rem;border-bottom:1px solid #e7e9ed">
    <section class="navbar-section"><a href="#" class="navbar-brand text-bold" style="font-size:1.1rem">👻 Spectre</a></section>
    <section class="navbar-section">
      <a href="#" class="btn btn-link">기능</a>
      <a href="../../index.html" class="btn btn-sm">← 카탈로그</a>
    </section>
  </header>

  <div class="hero-sp text-center">
    <div class="container grid-lg">
      <span class="chip" style="background:rgba(255,255,255,.2);color:#fff">경량 · 반응형</span>
      <h1 style="color:#fff;margin:.5rem 0">가볍고 유연한 컴포넌트</h1>
      <p>Flexbox 기반의 가벼운 프레임워크. 필요한 컴포넌트만 골라 조립하세요.</p>
      <button class="btn btn-lg">시작하기</button>
    </div>
  </div>

  <div class="container grid-lg">
    <div class="columns">
      <div class="column col-4 col-sm-12">
        <div class="card">
          <div class="card-header"><div class="card-title h5">📚 강의실 <span class="label label-primary">NEW</span></div></div>
          <div class="card-body">실시간 수업과 자료 공유.</div>
          <div class="card-footer"><button class="btn btn-primary btn-sm">입장</button></div>
        </div>
      </div>
      <div class="column col-4 col-sm-12">
        <div class="card">
          <div class="card-header"><div class="card-title h5">📝 과제함</div></div>
          <div class="card-body">제출 현황을 한눈에.</div>
          <div class="card-footer"><button class="btn btn-success btn-sm">확인</button></div>
        </div>
      </div>
      <div class="column col-4 col-sm-12">
        <div class="card">
          <div class="card-header"><div class="card-title h5">📈 성적표</div></div>
          <div class="card-body">자동 집계 리포트.</div>
          <div class="card-footer"><button class="btn btn-sm">보기</button></div>
        </div>
      </div>
    </div>

    <div class="columns" style="margin-top:1.5rem">
      <div class="column col-7 col-sm-12">
        <div class="toast toast-success mb-2">✅ 저장되었습니다.</div>
        <div class="toast toast-warning">⚠️ 마감이 임박했어요.</div>
        <div class="form-group" style="margin-top:1rem">
          <label class="form-label" for="nm">이름</label>
          <input class="form-input" id="nm" type="text" placeholder="홍길동">
        </div>
        <div class="form-group">
          <label class="form-label" for="fd">분야</label>
          <select class="form-select" id="fd"><option>국어</option><option>수학</option><option>과학</option></select>
        </div>
        <label class="form-checkbox"><input type="checkbox"><i class="form-icon"></i> 약관에 동의합니다</label>
        <button class="btn btn-primary">제출</button>
      </div>
      <div class="column col-5 col-sm-12">
        <div class="card"><div class="card-body">
          <div class="card-title h6">진행률</div>
          <div class="bar"><div class="bar-item" role="progressbar" style="width:70%">70%</div></div>
          <div class="bar mt-2"><div class="bar-item" role="progressbar" style="width:40%;background:#32b643">40%</div></div>
          <div style="margin-top:1rem">
            <span class="chip">교육</span><span class="chip">과제</span><span class="chip">알림</span>
          </div>
          <div style="margin-top:.5rem">
            <span class="label label-rounded label-primary">Primary</span>
            <span class="label label-rounded label-success">Success</span>
            <span class="label label-rounded label-error">Error</span>
          </div>
        </div></div>
      </div>
    </div>
    <p class="text-center text-gray" style="margin:2rem 0"><small>Spectre.css · 실제 라이브러리 — style-library / frameworks</small></p>
  </div>
</body>
</html>
