<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure.css · showcase</title>
  <link rel="stylesheet" href="pure-min.css">
  <style>
    body{font-family:"Pretendard","Malgun Gothic",sans-serif;color:#222;margin:0}
    .wrap{max-width:900px;margin:auto;padding:0 20px 50px}
    .topbar{background:#1f8dd6;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px}
    .topbar b{font-size:1.1rem}
    .hero{text-align:center;padding:40px 0}
    .card{border:1px solid #e5e5e5;border-radius:8px;padding:20px;margin:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .pure-button-primary{background:#1f8dd6}
    h1{margin:.2rem 0}
  </style>
</head>
<body>
  <div class="topbar">
    <b>🟦 Pure.css</b>
    <span style="opacity:.85;font-size:.9rem">by Yahoo</span>
    <a href="../../index.html" class="pure-button" style="margin-left:auto">← 카탈로그</a>
  </div>

  <div class="wrap">
    <div class="hero">
      <h1>작고 모듈러한 CSS</h1>
      <p style="color:#777">필요한 모듈만 골라 쓰는 초경량 프레임워크(5.7KB). 반응형 그리드와 폼이 깔끔해요.</p>
      <button class="pure-button pure-button-primary">시작하기</button>
      <button class="pure-button">둘러보기</button>
    </div>

    <div class="pure-g">
      <div class="pure-u-1 pure-u-md-1-3"><div class="card"><h3>📚 강의실</h3><p style="color:#777">실시간 수업과 자료 공유.</p><button class="pure-button pure-button-primary">입장</button></div></div>
      <div class="pure-u-1 pure-u-md-1-3"><div class="card"><h3>📝 과제함</h3><p style="color:#777">제출 현황을 한눈에.</p><button class="pure-button">확인</button></div></div>
      <div class="pure-u-1 pure-u-md-1-3"><div class="card"><h3>📈 성적표</h3><p style="color:#777">자동 집계 리포트.</p><button class="pure-button">보기</button></div></div>
    </div>

    <div class="pure-g" style="margin-top:20px">
      <div class="pure-u-1 pure-u-md-1-2" style="padding:8px">
        <h3>참가 신청</h3>
        <form class="pure-form pure-form-stacked">
          <label>이름</label><input class="pure-input-1" type="text" placeholder="홍길동">
          <label>분야</label>
          <select class="pure-input-1"><option>국어</option><option>수학</option><option>과학</option></select>
          <label class="pure-checkbox" style="margin-top:8px"><input type="checkbox"> 약관에 동의합니다</label>
          <button class="pure-button pure-button-primary" style="margin-top:10px">제출</button>
        </form>
      </div>
      <div class="pure-u-1 pure-u-md-1-2" style="padding:8px">
        <h3>학급 현황</h3>
        <table class="pure-table pure-table-horizontal" style="width:100%">
          <thead><tr><th>반</th><th>과목</th><th>진도</th></tr></thead>
          <tbody>
            <tr><td>1반</td><td>국어</td><td>100%</td></tr>
            <tr class="pure-table-odd"><td>2반</td><td>수학</td><td>60%</td></tr>
            <tr><td>3반</td><td>과학</td><td>15%</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <p style="text-align:center;color:#999;margin-top:30px"><small>Pure.css · 실제 라이브러리 — style-library / frameworks</small></p>
  </div>
</body>
</html>
