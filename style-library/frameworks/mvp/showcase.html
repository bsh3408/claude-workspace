<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP.css · showcase</title>
  <link rel="stylesheet" href="mvp.css">
</head>
<body>
  <header>
    <nav>
      <h1>🚀 MVP.css</h1>
      <ul>
        <li><a href="#">기능</a></li>
        <li><a href="#">소개</a></li>
        <li><a href="../../index.html">← 카탈로그</a></li>
      </ul>
    </nav>
    <h1>클래스 없이 빠르게</h1>
    <p>시맨틱 태그만으로 헤더·카드·폼·표까지 단정하게. 프로토타입과 소개 페이지를 빠르게 만들 때 좋아요.</p>
    <p><a href="#" role="button">시작하기</a> <a href="#">더 보기</a></p>
  </header>

  <main>
    <hr>
    <section>
      <aside>
        <h3>📚 강의실</h3>
        <p>실시간 수업과 자료 공유.</p>
        <p><a href="#">입장 →</a></p>
      </aside>
      <aside>
        <h3>📝 과제함</h3>
        <p>제출 현황을 한눈에.</p>
        <p><a href="#">확인 →</a></p>
      </aside>
      <aside>
        <h3>📈 성적표</h3>
        <p>자동 집계 리포트.</p>
        <p><a href="#">보기 →</a></p>
      </aside>
    </section>

    <section>
      <article>
        <h2>참가 신청</h2>
        <form>
          <label>이름<input type="text" placeholder="홍길동"></label>
          <label>분야<select><option>국어</option><option>수학</option><option>과학</option></select></label>
          <label>메모<textarea placeholder="자유롭게 적어주세요"></textarea></label>
          <button type="button">제출</button>
        </form>
      </article>
    </section>

    <section>
      <h2>학급 현황</h2>
      <table>
        <thead><tr><th>반</th><th>과목</th><th>진도</th></tr></thead>
        <tbody>
          <tr><td>1반</td><td>국어</td><td><mark>100%</mark></td></tr>
          <tr><td>2반</td><td>수학</td><td>60%</td></tr>
          <tr><td>3반</td><td>과학</td><td>15%</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <hr>
    <p><small>MVP.css · 실제 라이브러리 — style-library / frameworks</small></p>
  </footer>
</body>
</html>
