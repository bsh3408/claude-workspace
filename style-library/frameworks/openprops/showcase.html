<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Props · showcase</title>
  <link rel="stylesheet" href="open-props.min.css">
  <style>
    /* Open Props는 '변수(토큰) 모음'입니다. 아래 스타일은 전부 그 토큰만 사용해요. */
    body{font-family:var(--font-sans,"Pretendard",sans-serif);background:var(--gray-1);color:var(--gray-9);
      margin:0;padding:var(--size-6);line-height:var(--font-lineheight-3)}
    .wrap{max-width:820px;margin:auto}
    h1{font-size:var(--font-size-7);font-weight:var(--font-weight-8);letter-spacing:var(--font-letterspacing-0);margin:0}
    .sub{color:var(--gray-6);font-size:var(--font-size-3)}
    .card{background:#fff;border:1px solid var(--gray-3);border-radius:var(--radius-3);
      padding:var(--size-5);box-shadow:var(--shadow-2);margin-block:var(--size-5)}
    .btn{border:none;cursor:pointer;color:#fff;background:var(--blue-6);border-radius:var(--radius-2);
      padding:var(--size-2) var(--size-4);font-size:var(--font-size-2);font-weight:var(--font-weight-6);box-shadow:var(--shadow-2)}
    .btn.grad{background:var(--gradient-8)}
    .row{display:flex;gap:var(--size-3);flex-wrap:wrap;align-items:center}
    .label{font-size:var(--font-size-1);color:var(--gray-6);font-weight:var(--font-weight-7);
      text-transform:uppercase;letter-spacing:var(--font-letterspacing-2);margin-block:var(--size-4) var(--size-2)}
    .swatches{display:flex;gap:var(--size-2);flex-wrap:wrap}
    .sw{width:var(--size-8);height:var(--size-8);border-radius:var(--radius-2);box-shadow:var(--shadow-1)}
    .grads{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:var(--size-3)}
    .grad-box{height:var(--size-9);border-radius:var(--radius-3);box-shadow:var(--shadow-2)}
    .radii{display:flex;gap:var(--size-3);align-items:flex-end}
    .radii div{width:var(--size-8);height:var(--size-8);background:var(--blue-2);border:2px solid var(--blue-6)}
    .float{width:var(--size-9);height:var(--size-9);border-radius:var(--radius-round);background:var(--gradient-15);
      box-shadow:var(--shadow-4);animation:var(--animation-float)}
    a{color:var(--blue-7)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content:space-between">
      <span style="font-weight:var(--font-weight-8);font-size:var(--font-size-4)">⬡ Open Props</span>
      <a href="../../index.html" class="btn" style="background:var(--gray-3);color:var(--gray-8)">← 카탈로그</a>
    </div>

    <div style="margin-block:var(--size-6)">
      <h1>디자인 토큰 모음</h1>
      <p class="sub">컴포넌트가 아니라 <b>변수(토큰)</b>를 제공합니다. 색·간격·둥글기·그림자·그라데이션·애니메이션을 일관되게 쓰도록. 이 페이지의 모든 스타일이 그 토큰만으로 만들어졌어요.</p>
      <div class="row" style="margin-top:var(--size-4)">
        <button class="btn">기본 버튼</button>
        <button class="btn grad">그라데이션</button>
      </div>
    </div>

    <div class="card">
      <div class="label">색 팔레트 · --gray / --blue / --choco</div>
      <div class="swatches">
        <div class="sw" style="background:var(--gray-2)"></div><div class="sw" style="background:var(--gray-5)"></div>
        <div class="sw" style="background:var(--gray-8)"></div><div class="sw" style="background:var(--blue-4)"></div>
        <div class="sw" style="background:var(--blue-7)"></div><div class="sw" style="background:var(--green-6)"></div>
        <div class="sw" style="background:var(--orange-6)"></div><div class="sw" style="background:var(--pink-6)"></div>
        <div class="sw" style="background:var(--choco-7)"></div>
      </div>

      <div class="label">그라데이션 · --gradient-*</div>
      <div class="grads">
        <div class="grad-box" style="background:var(--gradient-1)"></div>
        <div class="grad-box" style="background:var(--gradient-3)"></div>
        <div class="grad-box" style="background:var(--gradient-7)"></div>
        <div class="grad-box" style="background:var(--gradient-15)"></div>
        <div class="grad-box" style="background:var(--gradient-20)"></div>
        <div class="grad-box" style="background:var(--gradient-23)"></div>
      </div>

      <div class="label">둥글기 · --radius-1 ~ 6</div>
      <div class="radii">
        <div style="border-radius:var(--radius-1)"></div>
        <div style="border-radius:var(--radius-2)"></div>
        <div style="border-radius:var(--radius-3)"></div>
        <div style="border-radius:var(--radius-4)"></div>
        <div style="border-radius:var(--radius-round)"></div>
      </div>

      <div class="label">애니메이션 · --animation-float</div>
      <div class="float"></div>
    </div>
    <p style="text-align:center;color:var(--gray-5)"><small>Open Props · 실제 라이브러리 — style-library / frameworks</small></p>
  </div>
</body>
</html>
