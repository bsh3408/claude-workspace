<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halfmoon · showcase</title>
  <link rel="stylesheet" href="halfmoon.min.css">
  <style>
    body{font-family:"Pretendard","Malgun Gothic",sans-serif}
    .wrap{max-width:960px;margin:auto;padding:20px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
    @media(max-width:700px){.grid3,.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="navbar navbar-expand rounded" style="padding:.6rem 1rem">
      <span class="navbar-brand">🌗 Halfmoon</span>
      <ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link active" href="#">홈</a></li><li class="nav-item"><a class="nav-link" href="#">기능</a></li></ul>
      <a href="../../index.html" class="btn btn-secondary btn-sm">← 카탈로그</a>
    </nav>

    <div class="card text-center mt-3">
      <div class="card-body">
        <span class="badge text-bg-primary mb-2">다크모드 내장</span>
        <h1 class="card-title">어두운 테마가 기본</h1>
        <p class="text-secondary">Bootstrap 5 위에 세련된 다크모드를 얹은 프레임워크. 관리자·대시보드에 잘 맞아요.</p>
        <button class="btn btn-primary">시작하기</button>
        <button class="btn btn-outline-secondary">둘러보기</button>
      </div>
    </div>

    <div class="grid3 mt-3">
      <div class="card"><div class="card-body"><span class="badge text-bg-success mb-2">교육</span><h5 class="card-title">📚 강의실</h5><p class="text-secondary">실시간 수업과 자료 공유.</p><button class="btn btn-primary btn-sm">입장</button></div></div>
      <div class="card"><div class="card-body"><h5 class="card-title">📝 과제함</h5><p class="text-secondary">제출 현황을 한눈에.</p><button class="btn btn-secondary btn-sm">확인</button></div></div>
      <div class="card"><div class="card-body"><h5 class="card-title">📈 성적표</h5><p class="text-secondary">자동 집계 리포트.</p><button class="btn btn-outline-secondary btn-sm">보기</button></div></div>
    </div>

    <div class="grid2 mt-3">
      <div class="card"><div class="card-body">
        <h5 class="card-title">참가 신청</h5>
        <div class="mb-2"><label class="form-label">이름</label><input type="text" class="form-control" placeholder="홍길동"></div>
        <div class="mb-2"><label class="form-label">분야</label><select class="form-select"><option>국어</option><option>수학</option></select></div>
        <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="c1"><label class="form-check-label" for="c1">약관에 동의합니다</label></div>
        <button class="btn btn-primary">제출</button>
      </div></div>
      <div>
        <div class="alert alert-success">✅ 저장되었습니다.</div>
        <div class="alert alert-warning">⚠️ 마감이 임박했어요.</div>
        <div class="card"><div class="card-body">
          <span class="badge text-bg-primary">교육</span>
          <span class="badge text-bg-secondary">과제</span>
          <span class="badge text-bg-danger">마감</span>
          <div class="progress mt-3"><div class="progress-bar" style="width:70%">70%</div></div>
        </div></div>
      </div>
    </div>
    <p class="text-center text-secondary mt-4"><small>Halfmoon · 실제 라이브러리 — style-library / frameworks</small></p>
  </div>
</body>
</html>
