<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton · showcase</title>
  <link rel="stylesheet" href="skeleton.css">
  <style>body{padding-top:2rem}</style>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="column" style="display:flex;align-items:center;gap:1rem">
        <strong style="font-size:1.4rem">🦴 Skeleton</strong>
        <a href="../../index.html" class="button" style="margin-left:auto;margin-bottom:0">← 카탈로그</a>
      </div>
    </div>

    <div class="row" style="margin-top:2rem">
      <div class="column">
        <h2>딱 필요한 뼈대만</h2>
        <p>400줄 남짓의 고전 미니멀 보일러플레이트. 12칼럼 그리드와 기본 요소만 담아 가볍게 시작합니다.</p>
        <a class="button button-primary" href="#">시작하기</a>
        <a class="button" href="#">둘러보기</a>
      </div>
    </div>

    <div class="row" style="margin-top:1rem">
      <div class="four columns"><h4>📚 강의실</h4><p>실시간 수업과 자료 공유.</p></div>
      <div class="four columns"><h4>📝 과제함</h4><p>제출 현황을 한눈에.</p></div>
      <div class="four columns"><h4>📈 성적표</h4><p>자동 집계 리포트.</p></div>
    </div>

    <div class="row" style="margin-top:1rem">
      <div class="six columns">
        <h4>참가 신청</h4>
        <label>이름</label><input class="u-full-width" type="text" placeholder="홍길동">
        <label>분야</label>
        <select class="u-full-width"><option>국어</option><option>수학</option><option>과학</option></select>
        <label><input type="checkbox"> 약관에 동의합니다</label>
        <input class="button-primary" type="submit" value="제출">
      </div>
      <div class="six columns">
        <h4>학급 현황</h4>
        <table class="u-full-width">
          <thead><tr><th>반</th><th>과목</th><th>진도</th></tr></thead>
          <tbody><tr><td>1반</td><td>국어</td><td>100%</td></tr><tr><td>2반</td><td>수학</td><td>60%</td></tr><tr><td>3반</td><td>과학</td><td>15%</td></tr></tbody>
        </table>
      </div>
    </div>
    <p style="text-align:center;color:#aaa"><small>Skeleton · 실제 라이브러리 — style-library / frameworks</small></p>
  </div>
</body>
</html>
