<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milligram · showcase</title>
  <link rel="stylesheet" href="milligram.min.css">
  <style>body{padding:0} .bar{border-bottom:1px solid #eee} .container{max-width:800px}</style>
</head>
<body>
  <section class="bar">
    <div class="container" style="display:flex;align-items:center;gap:1rem;padding:1rem 0">
      <strong style="font-size:1.3rem">◽ Milligram</strong>
      <a href="#">기능</a><a href="#">소개</a>
      <a href="../../index.html" class="button button-outline" style="margin-left:auto;margin-bottom:0">← 카탈로그</a>
    </div>
  </section>

  <div class="container" style="padding:3rem 0">
    <div class="row"><div class="column">
      <h1>깔끔하고 미니멀하게</h1>
      <p>단 2KB의 초미니멀 프레임워크. 군더더기 없는 타이포와 그리드로 빠르게 시작하세요.</p>
      <a class="button" href="#">시작하기</a>
      <a class="button button-outline" href="#">둘러보기</a>
    </div></div>

    <div class="row">
      <div class="column"><h3>📚 강의실</h3><p>실시간 수업과 자료 공유.</p><a class="button button-clear" href="#">입장 →</a></div>
      <div class="column"><h3>📝 과제함</h3><p>제출 현황을 한눈에.</p><a class="button button-clear" href="#">확인 →</a></div>
      <div class="column"><h3>📈 성적표</h3><p>자동 집계 리포트.</p><a class="button button-clear" href="#">보기 →</a></div>
    </div>

    <div class="row" style="margin-top:2rem">
      <div class="column column-60">
        <h3>참가 신청</h3>
        <label>이름</label><input type="text" placeholder="홍길동">
        <label>분야</label><select><option>국어</option><option>수학</option><option>과학</option></select>
        <label><input type="checkbox"> 약관에 동의합니다</label>
        <button>제출</button>
      </div>
      <div class="column column-40">
        <h3>학급 현황</h3>
        <table>
          <thead><tr><th>반</th><th>진도</th></tr></thead>
          <tbody><tr><td>1반</td><td>100%</td></tr><tr><td>2반</td><td>60%</td></tr><tr><td>3반</td><td>15%</td></tr></tbody>
        </table>
      </div>
    </div>
    <p style="text-align:center;color:#aaa"><small>Milligram · 실제 라이브러리 — style-library / frameworks</small></p>
  </div>
</body>
</html>
