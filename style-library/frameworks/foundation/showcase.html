<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foundation · showcase</title>
  <link rel="stylesheet" href="foundation.min.css">
  <style>body{font-family:"Pretendard","Malgun Gothic",sans-serif} .hero-f{background:#1779ba;color:#fff;padding:2.5rem 0;text-align:center;margin-bottom:1.5rem}</style>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-left">
      <ul class="menu">
        <li class="menu-text">🅕 Foundation</li>
        <li><a href="#">홈</a></li>
        <li><a href="#">기능</a></li>
      </ul>
    </div>
    <div class="top-bar-right">
      <ul class="menu"><li><a href="../../index.html" class="button hollow" style="margin:.3rem">← 카탈로그</a></li></ul>
    </div>
  </div>

  <div class="hero-f">
    <div class="grid-container">
      <span class="label secondary">엔터프라이즈급</span>
      <h1 style="color:#fff">견고한 반응형 프레임워크</h1>
      <p>대규모 서비스에서 검증된 그리드와 컴포넌트.</p>
      <button class="button large">시작하기</button>
      <button class="button large hollow" style="color:#fff;border-color:#fff">둘러보기</button>
    </div>
  </div>

  <div class="grid-container">
    <div class="grid-x grid-margin-x">
      <div class="cell medium-4"><div class="card"><div class="card-section">
        <span class="label success">교육</span><h4>📚 강의실</h4><p>실시간 수업과 자료 공유.</p><button class="button small">입장</button>
      </div></div></div>
      <div class="cell medium-4"><div class="card"><div class="card-section">
        <h4>📝 과제함</h4><p>제출 현황을 한눈에.</p><button class="button small secondary">확인</button>
      </div></div></div>
      <div class="cell medium-4"><div class="card"><div class="card-section">
        <h4>📈 성적표</h4><p>자동 집계 리포트.</p><button class="button small hollow">보기</button>
      </div></div></div>
    </div>

    <div class="grid-x grid-margin-x">
      <div class="cell medium-7">
        <div class="callout success">✅ 저장되었습니다.</div>
        <div class="callout warning">⚠️ 마감이 임박했어요.</div>
        <label>이름 <input type="text" placeholder="홍길동"></label>
        <label>분야 <select><option>국어</option><option>수학</option></select></label>
        <button class="button">제출</button>
      </div>
      <div class="cell medium-5">
        <div class="callout">
          <h5>진행률</h5>
          <div class="progress"><div class="progress-meter" style="width:70%"></div></div>
          <div class="progress success"><div class="progress-meter" style="width:40%"></div></div>
          <span class="badge primary">3</span>
          <span class="label">교육</span> <span class="label alert">마감</span>
        </div>
      </div>
    </div>
    <p class="text-center" style="color:#999;margin:1.5rem 0"><small>Foundation · 실제 라이브러리 — style-library / frameworks</small></p>
  </div>
</body>
</html>
