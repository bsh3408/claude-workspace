<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --bg:#eaf0f0; --surface:#ffffff; --surface-2:#f1f6f6; --surface-3:#e7efef;
    --border:#d3e0e0; --border-strong:#bcd0d0;
    --ink:#12242a; --ink-dim:#5b747b; --ink-faint:#8aa0a6;
    --accent:#0d8f88; --accent-ink:#ffffff; --accent-soft:#c7ece9;
    --gold:#b9770a; --gold-soft:#f6e5c2;
    --rank:#6b52d6; --rank-soft:#e0daf8; --good:#1f9e68;
    --shadow:0 1px 2px rgba(16,40,45,.06),0 8px 24px rgba(16,40,45,.08);
    --shadow-lg:0 12px 40px rgba(16,40,45,.16);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0a1317; --surface:#12222a; --surface-2:#172b34; --surface-3:#1e343e;
      --border:#26424c; --border-strong:#365660;
      --ink:#e9f2f2; --ink-dim:#9db3b8; --ink-faint:#6f8990;
      --accent:#35d0c0; --accent-ink:#08201d; --accent-soft:#123b39;
      --gold:#f2b544; --gold-soft:#3a2f14; --rank:#a595f7; --rank-soft:#2a2547; --good:#4bd08a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
      --shadow-lg:0 16px 50px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a1317; --surface:#12222a; --surface-2:#172b34; --surface-3:#1e343e;
    --border:#26424c; --border-strong:#365660;
    --ink:#e9f2f2; --ink-dim:#9db3b8; --ink-faint:#6f8990;
    --accent:#35d0c0; --accent-ink:#08201d; --accent-soft:#123b39;
    --gold:#f2b544; --gold-soft:#3a2f14; --rank:#a595f7; --rank-soft:#2a2547; --good:#4bd08a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 16px 50px rgba(0,0,0,.5);
  }
  [data-skin="amethyst"]{ --accent:#8b5cf6; --accent-ink:#fff; }
  [data-skin="coral"]{ --accent:#f2683e; --accent-ink:#fff; }
  [data-skin="lime"]{ --accent:#3fa62e; --accent-ink:#fff; }
  [data-skin="rose"]{ --accent:#d6558a; --accent-ink:#fff; }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;}
  .tnum{font-variant-numeric:tabular-nums}
  h1,h2,h3{text-wrap:balance;margin:0}
  button{font-family:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 20px 80px}

  .banner{background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);
    border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:14px}

  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
  .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;
    background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--rank)));box-shadow:var(--shadow)}
  .brand b{font-size:17px;letter-spacing:.04em;font-weight:800;display:block;line-height:1.1}
  .brand span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .savepill{font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-dim);display:flex;align-items:center;gap:6px}
  .savepill.saving{color:var(--gold)} .savepill.saved{color:var(--good)} .savepill.offline{color:var(--rank)}
  .iconbtn{background:var(--surface);border:1px solid var(--border);color:var(--ink-dim);width:38px;height:38px;
    border-radius:10px;cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.15s}
  .iconbtn:hover{color:var(--ink);border-color:var(--border-strong)}

  .hero{position:relative;overflow:hidden;border-radius:20px;padding:24px;margin-bottom:20px;
    background:radial-gradient(120% 140% at 88% -20%, color-mix(in srgb,var(--accent) 26%,transparent), transparent 55%),
      radial-gradient(90% 120% at 0% 120%, color-mix(in srgb,var(--rank) 20%,transparent), transparent 55%),var(--surface);
    border:1px solid var(--border);box-shadow:var(--shadow)}
  .hero-grid{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
  .avatar{width:96px;height:96px;border-radius:22px;display:grid;place-items:center;font-size:52px;flex:none;
    background:var(--surface-2);border:1px solid var(--border-strong);
    box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
  .who h2{font-size:23px;font-weight:800;letter-spacing:-.01em}
  .who .sid{color:var(--ink-dim);font-size:13px;margin-top:2px}
  .rankpill{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:5px 12px;border-radius:999px;
    font-weight:800;font-size:13px;background:var(--rank-soft);color:var(--rank);
    border:1px solid color-mix(in srgb,var(--rank) 35%,transparent)}
  .title-badge{display:inline-flex;align-items:center;gap:6px;margin:11px 0 0 8px;padding:5px 11px;border-radius:999px;
    font-weight:700;font-size:12px;background:var(--gold-soft);color:var(--gold);
    border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
  .stats{display:flex;gap:10px;flex:none}
  .stat{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px 16px;min-width:92px;text-align:center}
  .stat .n{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .stat .l{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:2px}
  .stat.gold .n{color:var(--gold)} .stat.acc .n{color:var(--accent)}
  .xpwrap{margin-top:20px}
  .xprow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:13px}
  .xprow b{font-weight:800} .xprow .to{color:var(--ink-dim)}
  .bar{height:13px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--border)}
  .bar > i{display:block;height:100%;border-radius:999px;width:0;
    background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--gold)));
    transition:width .8s cubic-bezier(.2,.8,.2,1)}

  .tabs{display:flex;gap:8px;margin:26px 0 16px;flex-wrap:wrap}
  .tab{border:1px solid var(--border);background:var(--surface);color:var(--ink-dim);padding:9px 16px;border-radius:11px;
    font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .areahead{display:flex;align-items:center;gap:11px;margin:24px 0 12px}
  .areahead .dot{width:11px;height:11px;border-radius:4px;flex:none}
  .areahead h3{font-size:15px;font-weight:800;letter-spacing:.01em}
  .areahead .prog{margin-left:auto;font-size:12px;color:var(--ink-dim);font-weight:700}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:17px 17px 15px;
    cursor:pointer;transition:.16s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
  .card:hover{transform:translateY(-3px);border-color:var(--border-strong);box-shadow:var(--shadow-lg)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card .type{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .card h4{font-size:16px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
  .card p{font-size:13px;color:var(--ink-dim);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
  .reward{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--border)}
  .reward.xp{color:var(--accent)} .reward.coin{color:var(--gold)}
  .card .go{margin-left:auto;font-size:13px;font-weight:800;color:var(--ink-dim)}
  .card.done{background:var(--surface-2)}
  .card.done::after{content:"완료 ✓";position:absolute;top:0;right:0;font-size:11px;font-weight:800;letter-spacing:.05em;
    color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface));padding:5px 11px;border-bottom-left-radius:12px;
    border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-top:0;border-right:0}
  .card.done h4{color:var(--ink-dim)}

  .shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 14px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:var(--shadow)}
  .item .glyph{font-size:38px;line-height:1;height:46px;display:grid;place-items:center}
  .item .nm{font-weight:800;font-size:14px}
  .item .lock{font-size:11px;color:var(--ink-faint);font-weight:700}
  .item button{width:100%;border:0;border-radius:10px;padding:9px;font-weight:800;font-size:13px;cursor:pointer;transition:.15s;
    background:var(--gold-soft);color:var(--gold)}
  .item button:hover{filter:brightness(1.05)}
  .item button.buy{background:var(--gold);color:#1c1406}
  .item button.equip{background:var(--accent);color:var(--accent-ink)}
  .item button.equipped{background:var(--surface-2);color:var(--ink-dim);cursor:default;border:1px solid var(--border)}
  .item button:disabled{background:var(--surface-2);color:var(--ink-faint);cursor:not-allowed}
  .item .price{display:inline-flex;gap:4px;align-items:center;font-weight:800;color:var(--gold);font-size:13px}
  .shopcat{font-size:13px;font-weight:800;color:var(--ink-dim);margin:22px 0 11px;text-transform:uppercase;letter-spacing:.12em}

  .lbrow{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--border);border-radius:14px;
    background:var(--surface);margin-bottom:9px;box-shadow:var(--shadow)}
  .lbrow .pos{font-size:18px;font-weight:800;width:34px;text-align:center;color:var(--ink-dim)}
  .lbrow.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .lbrow .nm{font-weight:800}
  .lbrow .rk{font-size:12px;color:var(--ink-dim);font-weight:700}
  .lbrow .xp{margin-left:auto;font-weight:800;color:var(--accent)}
  .lbrow .top1 .pos,.lbrow.first .pos{color:var(--gold)}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
  .panel h3{font-size:16px;font-weight:800;margin-bottom:6px}
  .panel p{font-size:13px;color:var(--ink-dim);margin:0 0 14px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:12px}
  .areaprog{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .aprow{display:flex;align-items:center;gap:12px}
  .aprow .apname{font-size:13px;font-weight:700;min-width:150px}
  .aprow .apbar{flex:1;height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--border)}
  .aprow .apbar > i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .aprow .apn{font-size:12px;font-weight:800;color:var(--ink-dim);min-width:46px;text-align:right}

  .scrim{position:fixed;inset:0;background:rgba(6,16,20,.55);backdrop-filter:blur(3px);display:none;place-items:center;padding:20px;z-index:50}
  .scrim.on{display:grid}
  .modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;width:min(560px,100%);
    max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
  .modal .mhead{padding:20px 22px 0}
  .modal .type{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
  .modal h3{font-size:20px;font-weight:800;margin:6px 0 0;letter-spacing:-.01em}
  .modal .area{font-size:12px;color:var(--ink-dim);margin-top:4px;font-weight:700}
  .modal .body{padding:16px 22px 0}
  .modal .prompt{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 15px;font-size:14px;color:var(--ink);white-space:pre-wrap}
  .modal label{display:block;font-size:12px;font-weight:800;color:var(--ink-dim);margin:16px 0 7px;text-transform:uppercase;letter-spacing:.08em}
  textarea,input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;color:var(--ink);
    padding:12px 13px;font-family:inherit;font-size:14px;resize:vertical;line-height:1.5}
  textarea{min-height:150px}
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .cnt{font-size:12px;color:var(--ink-faint);text-align:right;margin-top:6px;font-weight:600}
  .cnt.ok{color:var(--good)}
  .mfoot{padding:16px 22px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:14px;cursor:pointer;transition:.15s}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--border)}
  .btn.ghost:hover{color:var(--ink)}
  .rewardline{margin-left:auto;font-size:13px;font-weight:800;color:var(--ink-dim);display:flex;gap:10px}
  .rewardline .xp{color:var(--accent)} .rewardline .coin{color:var(--gold)}
  .onboard .modal{width:min(480px,100%)}
  .pickrow{display:flex;flex-wrap:wrap;gap:8px}
  .pick{width:52px;height:52px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);font-size:26px;cursor:pointer;display:grid;place-items:center;transition:.12s}
  .pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);
    padding:13px 20px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
    transition:.35s;z-index:80;display:flex;gap:9px;align-items:center;max-width:90vw}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.levelup{background:linear-gradient(120deg,var(--rank),var(--accent));color:#fff}
  .hide{display:none!important}
  .foot-note{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:40px;line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:640px){
    .hero-grid{grid-template-columns:1fr;text-align:center;justify-items:center}
    .stats{order:3} .avatar{width:82px;height:82px;font-size:44px}
    .aprow .apname{min-width:110px}
  }
</style>
</head>
<body>
<div class="wrap" id="app" style="display:none">
  <div class="banner hide" id="previewBanner">⚠️ 미리보기 모드 — 이 기기에만 저장됩니다. 실제 운영은 Apps Script 웹앱으로 배포하세요.</div>

  <header class="top">
    <div class="brand"><div class="logo">🛰️</div><div><b>STELLAR LAB</b><span>통합과학2 연구실</span></div></div>
    <div class="savepill" id="savePill">● 대기</div>
    <button class="iconbtn" id="themeBtn" title="밝게/어둡게" aria-label="테마 전환">◐</button>
    <button class="iconbtn" id="helpBtn" title="사용법" aria-label="도움말">?</button>
  </header>

  <section class="hero" aria-label="내 프로필">
    <div class="hero-grid">
      <div class="avatar" id="pAvatar">🔬</div>
      <div class="who">
        <h2 id="pName">연구원</h2>
        <div class="sid" id="pSid">학번 —</div>
        <div><span class="rankpill" id="pRank">⬡ Lv.1 견습 관찰자</span>
          <span class="title-badge hide" id="pTitle">🏅 칭호</span></div>
      </div>
      <div class="stats">
        <div class="stat acc"><div class="n tnum" id="sXp">0</div><div class="l">누적 XP</div></div>
        <div class="stat gold"><div class="n tnum" id="sCoin">0</div><div class="l">연구 코인</div></div>
        <div class="stat"><div class="n tnum" id="sDone">0</div><div class="l">완료 미션</div></div>
      </div>
    </div>
    <div class="xpwrap">
      <div class="xprow"><span><b id="lvlNow">Lv.1</b> · <span id="rankName">견습 관찰자</span></span>
        <span class="to tnum" id="xpToNext">다음 등급까지 70 XP</span></div>
      <div class="bar"><i id="xpFill"></i></div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="missions">🧭 미션 보드</button>
    <button class="tab" role="tab" aria-selected="false" data-view="shop">✨ 꾸미기 상점</button>
    <button class="tab" role="tab" aria-selected="false" data-view="board">🏆 랭킹</button>
    <button class="tab" role="tab" aria-selected="false" data-view="me">🙋 내 활동</button>
  </nav>

  <div id="view-missions"></div>
  <div id="view-shop" class="hide"></div>
  <div id="view-board" class="hide"></div>
  <div id="view-me" class="hide"></div>

  <div class="foot-note">STELLAR LAB · 2022 개정 통합과학2 수행평가 · 진행 내용은 선생님 스프레드시트에 자동 저장됩니다.</div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<div class="scrim onboard" id="onboard">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mhead"><div class="type">연구실 입장</div><h3>나만의 통합과학2 연구실</h3>
      <div class="area">이름과 학번을 입력하면 진행 내용이 저장되어 다음에 이어서 할 수 있어요.</div></div>
    <div class="body">
      <label for="obName">이름</label>
      <input type="text" id="obName" placeholder="예: 홍길동" maxlength="20" autocomplete="off">
      <label for="obSid">학번</label>
      <input type="text" id="obSid" placeholder="예: 20315 (반드시 정확하게)" maxlength="24" autocomplete="off">
      <label>시작 아바타</label>
      <div class="pickrow" id="obPick"></div>
      <div class="hint" id="obMsg"></div>
    </div>
    <div class="mfoot"><button class="btn primary" id="obStart" style="width:100%">🚀 연구 시작 / 이어하기</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
var CONFIG = <?!= CONFIG ?>;
</script>
<script>
(function(){
"use strict";
var AREAS=CONFIG.areas, MISSIONS=CONFIG.missions, RANKS=CONFIG.ranks,
    SHOP=CONFIG.shop, STARTER=CONFIG.starters||['🔬'];
var HAS_SERVER = (typeof google!=='undefined' && google.script && google.script.run);
var THEME_KEY='stellarlab_theme';

/* ---------- data layer ---------- */
function gsr(fn){ return function(){
  var a=[].slice.call(arguments);
  return new Promise(function(res,rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(google.script.run,a);
  });
};}
function cacheKey(id){return 'stellarlab_cache_'+id;}
function cacheSet(s){try{localStorage.setItem(cacheKey(s.id),JSON.stringify(s));}catch(e){}}
function cacheGet(id){try{var r=localStorage.getItem(cacheKey(id));return r?JSON.parse(r):null;}catch(e){return null;}}
var DB={
  load:function(id){
    if(HAS_SERVER) return gsr('loadProgress')(id).then(function(r){return (r&&r.found)?r.state:null;},
                                                        function(){return cacheGet(id);});
    return Promise.resolve(cacheGet(id));
  },
  save:function(s){
    cacheSet(s);
    if(HAS_SERVER) return gsr('saveProgress')(JSON.stringify(s));
    return Promise.resolve({ok:true, coin:s.coin, offline:true});
  },
  board:function(){
    if(HAS_SERVER) return gsr('getLeaderboard')();
    return Promise.resolve([]);
  }
};

/* ---------- state ---------- */
var S=null;
function fresh(){return{id:'',name:'',coin:0,completed:{},owned:{av_micro:1,th_default:1},
  equipped:{avatar:'🔬',skin:'',titleId:''}};}
function snapshot(){return{id:S.id,name:S.name,coin:S.coin,completed:S.completed,owned:S.owned,equipped:S.equipped};}

/* ---------- helpers ---------- */
var $=function(s,el){return (el||document).querySelector(s);};
function mission(id){for(var i=0;i<MISSIONS.length;i++)if(MISSIONS[i].id===id)return MISSIONS[i];}
function areaMeta(id){for(var i=0;i<AREAS.length;i++)if(AREAS[i].id===id)return AREAS[i];}
function findItem(cat,id){var a=SHOP[cat];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];}
function earnedXp(){var x=0;for(var i=0;i<MISSIONS.length;i++){var m=MISSIONS[i],c=S.completed[m.id];
  if(c&&c.response&&(''+c.response).trim().length>=m.min)x+=m.xp;}return x;}
function rankFor(xp){var r=RANKS[0];for(var i=0;i<RANKS.length;i++){if(xp>=RANKS[i].xp)r=RANKS[i];}return r;}
function nextRank(xp){for(var i=0;i<RANKS.length;i++){if(RANKS[i].xp>xp)return RANKS[i];}return null;}
function isDark(){var t=document.documentElement.getAttribute('data-theme');
  if(t)return t==='dark';return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

/* ---------- toast & save pill ---------- */
var toastT;
function toast(msg,levelup){var t=$('#toast');t.innerHTML=msg;t.className=levelup?'on levelup':'on';
  clearTimeout(toastT);toastT=setTimeout(function(){t.className='';},levelup?3200:2200);}
function saveStatus(st){var p=$('#savePill');
  var map={saving:['saving','저장 중…'],saved:['saved','저장됨 ✓'],offline:['offline','임시저장(오프라인)'],idle:['','● 대기']};
  var m=map[st]||map.idle;p.className='savepill '+m[0];p.textContent='● '+m[1];}

/* ---------- persistence queue ---------- */
var _saving=false,_dirty=false;
function persist(){
  render();
  saveStatus('saving');
  queueSave();
}
function queueSave(){
  if(_saving){_dirty=true;return;}
  _saving=true;
  DB.save(snapshot()).then(function(res){
    if(res&&typeof res.coin==='number')S.coin=res.coin;
    saveStatus(res&&res.offline?'offline':'saved');
  },function(){saveStatus('offline');})
  .then(function(){_saving=false;render();if(_dirty){_dirty=false;queueSave();}});
}

/* ================= RENDER ================= */
function render(){
  document.documentElement.setAttribute('data-skin',S.equipped.skin||'');
  var xp=earnedXp(),rank=rankFor(xp),nxt=nextRank(xp),done=doneCount();
  $('#pAvatar').textContent=S.equipped.avatar;
  $('#pName').textContent=S.name||'연구원';
  $('#pSid').textContent=S.id?('학번 '+S.id):'학번 —';
  $('#pRank').textContent=rank.sym+' Lv.'+rank.lv+' '+rank.name;
  $('#sXp').textContent=xp;$('#sCoin').textContent=S.coin;$('#sDone').textContent=done;
  $('#lvlNow').textContent='Lv.'+rank.lv;$('#rankName').textContent=rank.name;
  var tb=$('#pTitle');
  if(S.equipped.titleId){var ti=findItem('title',S.equipped.titleId);
    if(ti){tb.textContent=ti.glyph+' '+ti.nm;tb.classList.remove('hide');}else tb.classList.add('hide');}
  else tb.classList.add('hide');
  var fill,label;
  if(nxt){var span=nxt.xp-rank.xp,into=xp-rank.xp;fill=Math.max(4,Math.round(into/span*100));label='다음 등급까지 '+(nxt.xp-xp)+' XP';}
  else{fill=100;label='최고 등급 달성! 🏆';}
  $('#xpFill').style.width=fill+'%';$('#xpToNext').textContent=label;
  renderMissions();renderShop();renderMe();
}
function doneCount(){var n=0;for(var i=0;i<MISSIONS.length;i++){var m=MISSIONS[i],c=S.completed[m.id];
  if(c&&c.response&&(''+c.response).trim().length>=m.min)n++;}return n;}

function renderMissions(){
  var host=$('#view-missions');host.innerHTML='';
  AREAS.forEach(function(A){
    var ms=MISSIONS.filter(function(m){return m.area===A.id;});
    var dc=ms.filter(function(m){var c=S.completed[m.id];return c&&c.response&&(''+c.response).trim().length>=m.min;}).length;
    var hd=document.createElement('div');hd.className='areahead';
    var col=isDark()?A.dark:A.color;
    hd.innerHTML='<span class="dot" style="background:'+col+'"></span><h3>'+esc(A.name)+
      '</h3><span class="prog tnum">'+dc+' / '+ms.length+' 완료</span>';
    host.appendChild(hd);
    var grid=document.createElement('div');grid.className='cards';
    ms.forEach(function(m){
      var c=S.completed[m.id],d=c&&c.response&&(''+c.response).trim().length>=m.min;
      var card=document.createElement('button');card.className='card'+(d?' done':'');card.type='button';
      card.innerHTML='<span class="type">'+esc(m.type)+'</span><h4>'+esc(m.title)+'</h4>'+
        '<p>'+esc(m.prompt.split('\n')[0])+'</p><div class="foot">'+
        '<span class="reward xp">✦ '+m.xp+' XP</span><span class="reward coin">◈ '+m.coin+'</span>'+
        '<span class="go">'+(d?'답안 보기 ›':'수행하기 ›')+'</span></div>';
      card.addEventListener('click',function(){openMission(m);});
      grid.appendChild(card);
    });
    host.appendChild(grid);
  });
}

function renderShop(){
  var host=$('#view-shop');host.innerHTML='';
  var xp=earnedXp();
  [['avatar','아바타'],['theme','테마 색상'],['title','칭호']].forEach(function(pair){
    var cat=pair[0];
    var h=document.createElement('div');h.className='shopcat';h.textContent=pair[1];host.appendChild(h);
    var grid=document.createElement('div');grid.className='shopgrid';
    SHOP[cat].forEach(function(it){
      var owned=!!S.owned[it.id];
      var equipped=(cat==='avatar'&&S.equipped.avatar===it.glyph)||
                   (cat==='theme'&&(S.equipped.skin||'')===(it.skin||'')&&owned)||
                   (cat==='title'&&S.equipped.titleId===it.id);
      var lvOk=!it.lv||rankFor(xp).lv>=it.lv;
      var el=document.createElement('div');el.className='item';var btn;
      if(equipped)btn='<button class="equipped" disabled>착용 중 ✓</button>';
      else if(owned)btn='<button class="equip" data-cat="'+cat+'" data-id="'+it.id+'">착용하기</button>';
      else if(!lvOk)btn='<button disabled>Lv.'+it.lv+' 필요</button>';
      else if(S.coin<it.price)btn='<button disabled>코인 부족</button>';
      else btn='<button class="buy" data-cat="'+cat+'" data-id="'+it.id+'">구매</button>';
      var sub=it.price===0?'<span class="lock">기본 제공</span>':
        (owned?'<span class="lock">보유 중</span>':'<span class="price">◈ '+it.price+(it.lv?' · Lv.'+it.lv:'')+'</span>');
      el.innerHTML='<div class="glyph">'+it.glyph+'</div><div class="nm">'+esc(it.nm)+'</div>'+sub+btn;
      grid.appendChild(el);
    });
    host.appendChild(grid);
  });
  host.querySelectorAll('button[data-id]').forEach(function(b){
    b.addEventListener('click',function(){var cat=b.getAttribute('data-cat'),id=b.getAttribute('data-id');
      if(b.classList.contains('buy'))buy(cat,id);else equip(cat,id);});
  });
}

function renderBoard(){
  var host=$('#view-board');
  host.innerHTML='<div class="panel"><h3>🏆 연구원 랭킹</h3><p>누적 XP 기준 상위 '+(CONFIG.leaderboardTop||10)+'명입니다.</p>'+
    '<div class="btnrow"><button class="btn ghost" id="lbRefresh">↻ 새로고침</button></div><div id="lbList" style="margin-top:14px"></div></div>';
  $('#lbRefresh').addEventListener('click',loadBoard);
  loadBoard();
}
function loadBoard(){
  var list=$('#lbList');if(!list)return;
  list.innerHTML='<p style="color:var(--ink-dim);font-size:13px">불러오는 중…</p>';
  DB.board().then(function(rows){
    if(!rows||!rows.length){list.innerHTML='<p style="color:var(--ink-faint);font-size:13px">'+
      (HAS_SERVER?'아직 랭킹 데이터가 없어요.':'미리보기 모드에서는 랭킹이 없습니다.')+'</p>';return;}
    list.innerHTML='';
    rows.forEach(function(r){
      var me=(''+r.name)===(''+S.name);
      var medal=r.rank===1?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':r.rank;
      var el=document.createElement('div');el.className='lbrow'+(me?' me':'')+(r.rank===1?' first':'');
      el.innerHTML='<div class="pos">'+medal+'</div><div><div class="nm">'+esc(r.name)+(me?' (나)':'')+
        '</div><div class="rk">Lv.'+r.level+' '+esc(r.rankName||'')+' · 완료 '+(r.done||0)+'</div></div>'+
        '<div class="xp tnum">'+r.xp+' XP</div>';
      list.appendChild(el);
    });
  },function(){list.innerHTML='<p style="color:var(--rank);font-size:13px">랭킹을 불러오지 못했어요.</p>';});
}

function renderMe(){
  var host=$('#view-me');if($('#view-me').classList.contains('hide')&&host.dataset.built)return;
  var xp=earnedXp(),rank=rankFor(xp);
  var rows=AREAS.map(function(A){
    var ms=MISSIONS.filter(function(m){return m.area===A.id;});
    var dc=ms.filter(function(m){var c=S.completed[m.id];return c&&c.response&&(''+c.response).trim().length>=m.min;}).length;
    var pct=Math.round(dc/ms.length*100);
    return '<div class="aprow"><div class="apname">'+esc(A.name)+'</div>'+
      '<div class="apbar"><i style="width:'+pct+'%"></i></div><div class="apn tnum">'+dc+'/'+ms.length+'</div></div>';
  }).join('');
  host.innerHTML=
    '<div class="panel"><h3>내 활동 요약</h3><p>현재 <b>Lv.'+rank.lv+' '+esc(rank.name)+'</b> · 누적 '+xp+' XP · 완료 '+doneCount()+' / '+MISSIONS.length+' 미션</p>'+
    '<div class="areaprog">'+rows+'</div></div>'+
    '<div class="panel" style="margin-top:16px"><h3>기록 관리</h3>'+
    '<p>진행 내용은 자동으로 선생님께 전송·저장됩니다. 필요하면 내 답안을 파일로도 받을 수 있어요.</p>'+
    '<div class="btnrow"><button class="btn ghost" id="meTxt">📄 내 답안 요약 저장(.txt)</button>'+
    '<button class="btn ghost" id="meSwitch" style="color:var(--rank)">🔄 다른 학생으로 전환</button></div></div>';
  host.dataset.built='1';
  $('#meTxt').addEventListener('click',downloadSummary);
  $('#meSwitch').addEventListener('click',switchStudent);
}

/* ================= ACTIONS ================= */
function openMission(m){
  var c=S.completed[m.id];var done=c&&c.response&&(''+c.response).trim().length>=m.min;
  var mo=$('#modal');
  mo.innerHTML='<div class="mhead"><div class="type">'+esc(m.type)+' · '+esc(areaMeta(m.area).name)+'</div>'+
    '<h3>'+esc(m.title)+'</h3></div><div class="body"><div class="prompt">'+esc(m.prompt)+'</div>'+
    '<label for="ans">나의 답안</label><textarea id="ans" placeholder="여기에 내 생각을 정리해 적어 보세요...">'+
    esc(c?c.response:'')+'</textarea><div class="cnt" id="cnt"></div></div>'+
    '<div class="mfoot"><button class="btn ghost" id="mClose">닫기</button>'+
    '<span class="rewardline"><span class="xp">✦ '+m.xp+' XP</span><span class="coin">◈ '+m.coin+'</span></span>'+
    '<button class="btn primary" id="mSubmit">'+(done?'답안 수정':'제출하고 보상 받기')+'</button></div>';
  openScrim();
  var ta=$('#ans',mo),cnt=$('#cnt',mo),sub=$('#mSubmit',mo);
  function upd(){var n=ta.value.trim().length,ok=n>=m.min;cnt.textContent=n+' / 최소 '+m.min+'자';
    cnt.className='cnt'+(ok?' ok':'');sub.disabled=!ok;}
  upd();ta.addEventListener('input',upd);ta.focus();
  $('#mClose',mo).addEventListener('click',closeScrim);
  sub.addEventListener('click',function(){submitMission(m,ta.value.trim(),done);});
}
function submitMission(m,text,wasDone){
  if(text.length<m.min)return;
  var before=rankFor(earnedXp()).lv;
  S.completed[m.id]={response:text};
  if(!wasDone)S.coin+=m.coin;
  var after=rankFor(earnedXp()).lv;
  closeScrim();persist();
  if(!wasDone){
    if(after>before){var r=rankFor(earnedXp());toast('🎉 레벨 업! <b>Lv.'+r.lv+' '+r.name+'</b> 달성!',true);}
    else toast('✅ 미션 완료! +'+m.xp+' XP · +'+m.coin+' 코인');
  }else toast('✏️ 답안을 수정했어요');
}
function buy(cat,id){
  var it=findItem(cat,id);if(!it||S.owned[id])return;
  if(it.lv&&rankFor(earnedXp()).lv<it.lv)return;
  if(S.coin<it.price)return;
  S.coin-=it.price;S.owned[id]=1;
  applyEquip(cat,id);persist();
  toast('🛍️ \''+it.nm+'\' 구매 & 착용 완료!');
}
function equip(cat,id){var it=findItem(cat,id);if(!it||!S.owned[id])return;applyEquip(cat,id);persist();toast('✨ 적용했어요');}
function applyEquip(cat,id){var it=findItem(cat,id);
  if(cat==='avatar')S.equipped.avatar=it.glyph;
  else if(cat==='theme')S.equipped.skin=it.skin||'';
  else if(cat==='title')S.equipped.titleId=(S.equipped.titleId===id?'':id);}

function downloadSummary(){
  var xp=earnedXp(),rank=rankFor(xp),L=[];
  L.push('통합과학2 수행평가 · STELLAR LAB 활동 결과');
  L.push('====================================');
  L.push('이름: '+(S.name||'-')+'   학번: '+(S.id||'-'));
  L.push('등급: Lv.'+rank.lv+' '+rank.name+'   누적 XP: '+xp+'   완료: '+doneCount()+'/'+MISSIONS.length);
  AREAS.forEach(function(A){
    L.push('\n■ '+A.name);
    MISSIONS.filter(function(m){return m.area===A.id;}).forEach(function(m){
      var c=S.completed[m.id],d=c&&c.response&&(''+c.response).trim().length>=m.min;
      L.push('\n['+(d?'완료':'미완료')+'] '+m.title+' ('+m.type+', '+m.xp+'XP)');
      if(d)L.push(c.response.split('\n').map(function(x){return '  '+x;}).join('\n'));
    });
  });
  var blob=new Blob([L.join('\n')],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='통합과학2_수행평가_'+((S.name||'학생').replace(/[^\w가-힣]/g,''))+'.txt';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},500);
  toast('📄 요약을 저장했어요');
}
function switchStudent(){
  var mo=$('#modal');
  mo.innerHTML='<div class="mhead"><div class="type">확인</div><h3>다른 학생으로 전환할까요?</h3></div>'+
    '<div class="body"><div class="prompt">저장된 내용은 서버에 안전하게 남아 있어요. 이 기기에서 로그아웃하고 새 학생으로 시작합니다.</div></div>'+
    '<div class="mfoot"><button class="btn ghost" id="swCancel">취소</button>'+
    '<button class="btn primary" id="swOk" style="margin-left:auto">전환</button></div>';
  openScrim();
  $('#swCancel',mo).addEventListener('click',closeScrim);
  $('#swOk',mo).addEventListener('click',function(){closeScrim();S=null;$('#app').style.display='none';startOnboard();});
}

/* ---------- scrim ---------- */
function openScrim(){$('#scrim').classList.add('on');}
function closeScrim(){$('#scrim').classList.remove('on');}
$('#scrim').addEventListener('click',function(e){if(e.target===this)closeScrim();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeScrim();});

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected','false');});
    t.setAttribute('aria-selected','true');
    var v=t.getAttribute('data-view');
    ['missions','shop','board','me'].forEach(function(id){$('#view-'+id).classList.toggle('hide',id!==v);});
    if(v==='board')renderBoard();
    if(v==='me'){$('#view-me').dataset.built='';renderMe();}
  });
});

/* ---------- theme ---------- */
$('#themeBtn').addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var next=cur==='dark'?'light':(cur==='light'?'dark':(isDark()?'light':'dark'));
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem(THEME_KEY,next);}catch(e){}
  renderMissions();
});
(function(){try{var t=localStorage.getItem(THEME_KEY);if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();

/* ---------- help ---------- */
$('#helpBtn').addEventListener('click',function(){
  var mo=$('#modal');
  mo.innerHTML='<div class="mhead"><div class="type">사용법</div><h3>STELLAR LAB 안내</h3></div>'+
    '<div class="body"><div class="prompt">① <b>미션 보드</b>에서 과제를 골라 답안을 쓰고 제출하면 <b>XP</b>와 <b>코인</b>이 쌓여요.\n\n'+
    '② XP가 쌓이면 <b>연구원 등급</b>이 오릅니다.\n\n③ 코인으로 <b>상점</b>에서 아바타·테마·칭호를 사고 꾸며요.\n\n'+
    '④ <b>랭킹</b>에서 내 순위를 확인하고, <b>내 활동</b>에서 진행 상황을 봐요.\n\n'+
    '⑤ 답안·점수는 자동 저장되어 다음에 같은 학번으로 이어서 할 수 있어요.</div></div>'+
    '<div class="mfoot"><button class="btn primary" id="hOk" style="width:100%">알겠어요</button></div>';
  openScrim();$('#hOk',mo).addEventListener('click',closeScrim);
});

/* ================= ONBOARDING ================= */
var obAvatar='🔬';
function startOnboard(){
  var pick=$('#obPick');pick.innerHTML='';obAvatar=STARTER[0]||'🔬';
  STARTER.forEach(function(g,i){
    var b=document.createElement('button');b.className='pick';b.type='button';b.textContent=g;
    b.setAttribute('aria-pressed',i===0?'true':'false');
    b.addEventListener('click',function(){obAvatar=g;
      pick.querySelectorAll('.pick').forEach(function(x){x.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true');});
    pick.appendChild(b);
  });
  $('#obName').value='';$('#obSid').value='';$('#obMsg').textContent='';
  $('#onboard').classList.add('on');$('#obName').focus();
}
$('#obStart').addEventListener('click',function(){
  var nm=$('#obName').value.trim(),id=$('#obSid').value.trim();
  if(!nm){$('#obMsg').textContent='이름을 입력해 주세요.';$('#obName').focus();return;}
  if(!id){$('#obMsg').textContent='학번을 입력해 주세요. (저장 기준이 됩니다)';$('#obSid').focus();return;}
  $('#obMsg').textContent='불러오는 중…';
  var btn=this;btn.disabled=true;
  DB.load(id).then(function(saved){
    if(saved){S=Object.assign(fresh(),saved);S.id=id;S.name=nm;toast('👋 '+nm+' 연구원님, 다시 오신 걸 환영해요!');}
    else{S=fresh();S.id=id;S.name=nm;S.equipped.avatar=obAvatar;toast('🚀 '+nm+' 연구원님, 환영합니다!');}
    $('#onboard').classList.remove('on');btn.disabled=false;
    $('#app').style.display='';
    saveStatus('idle');render();queueSave();
  },function(){btn.disabled=false;$('#obMsg').textContent='연결에 실패했어요. 다시 시도해 주세요.';});
});

/* ================= INIT ================= */
if(!HAS_SERVER)$('#previewBanner').classList.remove('hide');
startOnboard();
})();
</script>
</body>
</html>
